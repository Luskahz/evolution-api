services:
  api:
    container_name: evolution_test_api
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
    ports:
      - "127.0.0.1:${EVOLUTION_API_PORT:-4080}:8080"
    volumes:
      - evolution_test_instances:/evolution/instances
    networks:
      test-net:
        aliases:
          - evolution-api
    env_file:
      - .env.test
    expose:
      - "8080"

  redis:
    container_name: evolution_test_redis
    image: redis:latest
    restart: unless-stopped
    command: redis-server --port 6379 --appendonly yes
    volumes:
      - evolution_test_redis:/data
    networks:
      test-net:
        aliases:
          - evolution-redis
    expose:
      - "6379"

  postgres:
    container_name: evolution_test_postgres
    image: postgres:15
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=1000
      - -c
      - listen_addresses=*
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - evolution_test_postgres:/var/lib/postgresql/data
    networks:
      test-net:
        aliases:
          - evolution-postgres
    expose:
      - "5432"

volumes:
  evolution_test_instances:
  evolution_test_redis:
  evolution_test_postgres:

networks:
  test-net:
    name: evolution-test-net
    driver: bridge